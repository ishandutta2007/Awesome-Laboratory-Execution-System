<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" viewBox="0 0 900 280" style="background:#090d16;border-radius:12px;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#0a101f"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="textShadow"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".8" stdDeviation="3"/></filter><style>@keyframes float1{0%{transform:translateY(0) scale(1);opacity:.35}50%{transform:translateY(-15px) scale(1.1);opacity:.7}}@keyframes float2{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(12px) scale(.95);opacity:.65}}@keyframes pulseBeam{0%{stroke-dashoffset:600;opacity:.2}50%{opacity:.8}}@keyframes orbGlow{0%{r:18;opacity:.4}50%{r:24;opacity:.8}}.floating-orb-1{animation:float1 7s ease-in-out infinite}.floating-orb-2{animation:float2 9s ease-in-out infinite}.animated-beam{stroke-dasharray:60,140;animation:pulseBeam 5s linear infinite}.pulsing-core{animation:orbGlow 4s ease-in-out infinite}.spinning-geom{transform-origin:780px 140px;animation:rotateHex 24s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><g stroke="#1e293b" stroke-width=".8" opacity=".35"><line x1="0" x2="900" y1="40" y2="40"/><line x1="0" x2="900" y1="80" y2="80"/><line x1="0" x2="900" y1