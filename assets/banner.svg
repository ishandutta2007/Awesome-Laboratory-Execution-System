<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280" style="background:#090d16; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(12px) scale(0.95); opacity: 0.65; }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes orbGlow {
        0%, 100% { r: 18; opacity: 0.4; }
        50% { r: 24; opacity: 0.8; }
      }
      @keyframes rotateHex {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating-orb-1 { animation: float1 7s ease-in-out infinite; }
      .floating-orb-2 { animation: float2 9s ease-in-out infinite; }
      .animated-beam {
        stroke-dasharray: 60, 140;
        animation: pulseBeam 5s linear infinite;
      }
      .pulsing-core { animation: orbGlow 4s ease-in-out infinite; }
      .spinning-geom { transform-origin: 780px 140px; animation: rotateHex 24s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- Dynamic Ambient Glow Circles -->
  <circle cx="120" cy="60" r="120" fill="#0284c7" opacity="0.12" filter="url(#glow)" class="floating-orb-1"/>
  <circle cx="780" cy="140" r="160" fill="#7c3aed" opacity="0.14" filter="url(#glow)" class="floating-orb-2"/>

  <!-- Dynamic Laboratory Pipeline Circuit / Workflows -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="1.5">
    <!-- Workflow execution path -->
    <path d="M 620 220 L 680 180 L 750 180 L 800 130 L 860 130" opacity="0.4"/>
    <path d="M 650 70 L 710 110 L 770 110 L 820 160 L 880 160" opacity="0.4"/>
    <!-- Animated Light Pulse Beams -->
    <path class="animated-beam" d="M 620 220 L 680 180 L 750 180 L 800 130 L 860 130" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <path class="animated-beam" d="M 650 70 L 710 110 L 770 110 L 820 160 L 880 160" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Rotating Hex Geometry (Right Side Lab Symbolism) -->
  <g class="spinning-geom" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.25">
    <polygon points="780,95 819,117 819,163 780,185 741,163 741,117"/>
    <circle cx="780" cy="140" r="35" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Glowing Sensor Nodes -->
  <g>
    <circle cx="680" cy="180" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="750" cy="180" r="4" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="800" cy="130" r="5" fill="#38bdf8" class="pulsing-core" filter="url(#glow)"/>
    <circle cx="710" cy="110" r="4" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="770" cy="110" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="820" cy="160" r="5" fill="#a855f7" class="pulsing-core" filter="url(#glow)"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Tags -->
  <g filter="url(#textShadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(60, 36)">
      <rect width="255" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <circle cx="13" cy="13" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">LABORATORY EXECUTION SYSTEMS</text>
    </g>

    <!-- Main Heading -->
    <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Laboratory Execution System
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="60" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="url(#primaryGrad)">
      SOP Enforcement • Touch-Screen Bench Guidance • LIMS &amp; ELN Integration
    </text>

    <!-- SEO / Description line -->
    <text x="60" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Curated index of enterprise SaaS platforms, compliance workflows, and open-source lab tools.
    </text>

    <!-- Tech Badges inside Banner -->
    <g transform="translate(60, 206)">
      <!-- Badge 1: 21 CFR Part 11 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">✓ 21 CFR Part 11</text>
      </g>
      <!-- Badge 2: GxP / ISO 17025 -->
      <g transform="translate(122, 0)">
        <rect width="124" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">✓ GxP &amp; ISO 17025</text>
      </g>
      <!-- Badge 3: LIMS / ELN -->
      <g transform="translate(256, 0)">
        <rect width="106" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">✓ LIMS + ELN</text>
      </g>
      <!-- Badge 4: Open Source -->
      <g transform="translate(372, 0)">
        <rect width="116" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" fill="#38bdf8">⚡ Open Source</text>
      </g>
    </g>
  </g>
</svg>
